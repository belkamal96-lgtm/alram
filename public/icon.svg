<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="mountGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="mountGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#skyGrad)" />

  <!-- Alarm Bell Tops -->
  <path d="M120 120 C100 80, 150 50, 180 80 Z" fill="#f59e0b" />
  <path d="M392 120 C412 80, 362 50, 332 80 Z" fill="#f59e0b" />

  <!-- Himalayan Peaks in Silhouette behind Clock -->
  <polygon points="120,380 220,210 320,380" fill="url(#mountGrad2)" opacity="0.6" />
  <polygon points="230,380 340,190 440,380" fill="url(#mountGrad1)" opacity="0.8" />
  <polygon points="340,190 320,230 360,230" fill="#ffffff" />
  <polygon points="220,210 205,245 235,245" fill="#ffffff" />

  <!-- Sun Rising Behind -->
  <circle cx="256" cy="220" r="75" fill="url(#sunGrad)" filter="url(#glow)" />

  <!-- Alarm Outer Ring -->
  <circle cx="256" cy="280" r="140" fill="#0f172a" stroke="#f59e0b" stroke-width="14" />
  <circle cx="256" cy="280" r="126" fill="#1e293b" />

  <!-- Clock Hour Ticks -->
  <line x1="256" y1="168" x2="256" y2="182" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" />
  <line x1="256" y1="378" x2="256" y2="392" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" />
  <line x1="144" y1="280" x2="158" y2="280" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" />
  <line x1="354" y1="280" x2="368" y2="280" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" />

  <!-- Nepal Time Pointer: Hands pointing to 5:40 -->
  <!-- Hour hand towards 5 (~150 deg) -->
  <line x1="256" y1="280" x2="295" y2="335" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" />
  <!-- Minute hand towards 40 (~240 deg) -->
  <line x1="256" y1="280" x2="185" y2="320" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
  <!-- Center Pin -->
  <circle cx="256" cy="280" r="8" fill="#ffffff" />

  <!-- Little Camera Shutter Icon at Bottom of Clock -->
  <g transform="translate(236, 325) scale(0.8)">
    <rect x="0" y="4" width="24" height="18" rx="4" fill="#38bdf8" />
    <circle cx="12" cy="13" r="5" fill="#0f172a" />
    <circle cx="12" cy="13" r="3" fill="#ffffff" />
    <rect x="6" y="1" width="6" height="3" rx="1" fill="#38bdf8" />
  </g>
</svg>
